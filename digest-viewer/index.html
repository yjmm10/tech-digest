<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>技术周报归档</title>
    <meta
      name="description"
      content="技术周报归档：聚合 Arxiv 论文、GitHub 趋势、RSS 资讯等技术周报，支持检索、筛选、收藏与 RSS 订阅。"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <script>
      (function () {
        try {
          var p = localStorage.getItem("digest-viewer-theme");
          var light =
            p === "light" ||
            (p !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
          if (p) document.documentElement.dataset.themePref = p;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-web@1.7.0/style.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
